
---
- name: Automatizacion de servidores Ubuntu
  hosts: servidores
  become: yes

  tasks:
    - name: Actualizar paquetes de APT
      apt:
        update_cache: yes
        upgrade: dist

    - name: Crear el usuario itla
      user:
        name: itla
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Crear la carpeta app
      file:
        path: /home/itla/app
        state: directory
        owner: itla
        group: itla
        mode: '0755'

    - name: Crear el archivo hola.txt en la carpeta app
      copy:
        dest: /home/itla/app/hola.txt
        content: "Hola desde {{ inventory_hostname }}\n"
        owner: itla
        group: itla
        mode: '0644'

    - name: Instalar cowsay y htop
      apt:
        name:
          - cowsay
          - htop
        state: present